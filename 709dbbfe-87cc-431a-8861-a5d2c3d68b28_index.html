    desc:'除审计机构外，外部投行参与交易结构设计与融资，评级机构与卖方分析师长期维持看多与乐观评级，共同构成支撑安然股价的外部信心链条。事后花旗集团、摩根大通、美国银行等因涉嫌财务欺诈，分别向破产受害者赔偿约 20 亿、22 亿和 6900 万美元。' },
  { from:'lay', to:'staff', title:'核心管理层 × 员工群体：被文化与退休金绑定',
    desc:'核心管理层用狼性文化、高薪、期权和退休金计划把员工与公司绑定，鼓励员工持有安然股票。公司崩塌后，上万名员工失业，许多人的个人养老金与持股同时归零，成为这起事件中最直接的受害者群体。' },
  { from:'mark', to:'skilling', title:'Mark × Skilling：海外项目包袱',
    desc:'Rebecca Mark 主导的海外大型高风险能源项目向 Skilling 等核心管理层汇报，这些项目后期成为公司亏损包袱；Mark 较早离开安然，其遗留业务是安然业务线上的争议部分。' }
];

/* ===== 渲染 ===== */
const stage = document.getElementById('stage');
const svg = document.getElementById('linksSvg');
const NS = 'http://www.w3.org/2000/svg';

function curvePath(a, b){
  const mx = (a.x + b.x) / 2;
  const dy = b.y - a.y;
  const c1x = mx, c1y = a.y + dy * 0.35;
  const c2x = mx, c2y = b.y - dy * 0.35;
  return `M ${a.x} ${a.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${b.x} ${b.y}`;
}

LINKS.forEach((lk, i) => {
  const a = PEOPLE[lk.from], b = PEOPLE[lk.to];
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', curvePath(a, b));
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#C99AA4');
  path.setAttribute('stroke-width', '2');
  path.setAttribute('stroke-dasharray', '7 7');
  path.setAttribute('stroke-linecap', 'round');
  path.style.cursor = 'pointer';
  path.style.opacity = '.75';
  path.addEventListener('mouseenter', () => { path.setAttribute('stroke', '#B85C6E'); path.style.opacity='1'; });
  path.addEventListener('mouseleave', () => { path.setAttribute('stroke', '#C99AA4'); path.style.opacity='.75'; });
  path.addEventListener('click', () => openLink(lk));
  svg.appendChild(path);
});

Object.entries(PEOPLE).forEach(([id, p]) => {
  const el = document.createElement('div');
  el.className = 'node ' + p.type;
  const w = p.type === 'main' ? 150 : 96;
  el.style.left = (p.x - w/2) + 'px';
  el.style.top = (p.y - w/2) + 'px';
  if (p.type === 'minor') el.style.background = p.color;
  if (p.type === 'main'){
    el.innerHTML = `<img src="${p.photo}" alt="${p.name}"><div class="tag">${p.cn}</div>`;
  } else {
    el.innerHTML = `<div class="nm">${p.cn}</div><div class="en">${p.name}</div>`;
  }
  el.addEventListener('click', () => openPerson(id));
  stage.appendChild(el);
});

/* ===== 弹窗 ===== */
const mask = document.getElementById('mask');
const modal = document.getElementById('modal');

function openPerson(id){
  const p = PEOPLE[id];
  let html = `<button class="close" onclick="closeModal()">×</button>`;
  html += `<h2>${p.cn} <span style="font-size:15px;color:#8A7A80">${p.name}</span></h2>`;
  html += `<div class="sub">${p.role}</div>`;
  if (p.type === 'main'){
    html += `<h3>身份与履历</h3><p>${p.bio}</p><h3>经历时间线</h3><div class="timeline">`;
    p.timeline.forEach(t => {
      html += `<div class="tl-item"><div class="tl-year">${t[0]}</div><div class="tl-text">${t[1]}</div></div>`;
    });
    html += `</div>`;
  } else {
    html += `<span class="rel-tag">身份与纠葛</span><p>${p.rel}</p>`;
  }
  modal.innerHTML = html;
  mask.classList.add('show');
}

function openLink(lk){
  let html = `<button class="close" onclick="closeModal()">×</button>`;
  html += `<h2>${lk.title}</h2>`;
  html += `<h3>事件完整介绍</h3><p>${lk.desc}</p>`;
  modal.innerHTML = html;
  mask.classList.add('show');
}

function closeModal(){ mask.classList.remove('show'); }
mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
